name: "Claude Code"
enabled: false

targets:
  agents:
    dest: "CLAUDE.md"

  rules:
    dest: ".claude/rules"

  skills:
    dest: ".claude/skills"

  commands:
    dest: ".claude/commands"

  subagents:
    dest: ".claude/agents"

  scripts:
    dest: ".claude/scripts"

  workflow:
    dest: ".claude/workflow"

  settings:
    source: ".ai/src/settings/claude.json"
    dest: ".claude/settings.json"

  mcp:
    source: ".ai/src/mcp/claude.json"
    dest: ".mcp.json"

  # Blocks edits to generated files; wired up by hooks.PreToolUse in settings.
  # Not profile-scoped: settings reference it through ${CLAUDE_PROJECT_DIR}, so
  # every config home shares this one script instead of getting a dead copy.
  guard:
    dest: ".claude/hooks/agentsync-guard.sh"
    profile_scoped: false
