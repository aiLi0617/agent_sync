name: "OpenAI Codex"
enabled: false

targets:
  agents:
    dest: "AGENTS.md"

  rules:
    inline_into_agents: true

  skills:
    dest: ".agents/skills"

  commands:
    as_skills: true

  subagents:
    dest: ".codex/agents"
    format: toml

  scripts:
    dest: ".codex/scripts"

  workflow:
    dest: ".codex/workflow"

  hooks:
    source: ".ai/src/hooks/codex.json"
    dest: ".codex/hooks.json"

  settings:
    source: ".ai/src/settings/codex.toml"
    dest: ".codex/config.toml"
